    population:
      gender: male
      level: elite
      event: "100m"
      age_range: "21-35"
    n: 14            # 7 名决赛选手 × 左右腿各一次着地
    low: 133.1
    high: 166.7
    mean: 149.9
    sd: 8.4
    source:
      authors: "IAAF Biomechanics Project"
      year: 2017
      title: >-
        IAAF World Championships London 2017 — Biomechanical Report:
        Men's 100 m Final and Semi-Finals
      journal: "IAAF Biomechanics Report"
      doi: ""
      locator: "Table 10 与 Table 11，Knee angle at touchdown 行"
    measurement_note: >-
      口径完全一致：原文定义为「the angle between the thigh and lower leg
      and considered to be 180° in the anatomical standing position」，
      与本项目的 knee_angle_touchdown 定义相同。
      测量手段为高速摄影（500 fps），矢状面二维分析。
      取的是「比赛中段一次分析步」的着地瞬间，
      不是某一段的平均 —— 属于单次代表性测量。
    extraction_note: >-
      从 Table 10（3 名奖牌得主）与 Table 11（其余 5 名决赛选手）
      提取 Knee angle at touchdown 行的左右腿各一个值，共 16 个。
      剔除 VICAUT 的 6 个值（92.3–100.2°）—— 与其余 7 人
      （136.5–162.1°）相差一个量级，怀疑是 PDF 提取时列错位，
      不是真实测量。剔除后 n=14（7 人 × 2 腿）。
      区间由 mean±2sd 推算（非原文直接报告），已按规范标注为推算。
      换算过程见 scripts/literature/verify_iaaf_standards.py。
    verified_by: "开发阶段自查"
    verified_date: "2026-10-05"
    std_version: "2026Q1"
    citation_zh: >-
      国际田联《2017 伦敦世锦赛生物力学报告》男子 100m 决赛
