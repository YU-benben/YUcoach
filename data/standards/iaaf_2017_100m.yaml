# 参考标准值库 · 世界大赛生物力学报告
#
# 数据来源：
#   IAAF/Biomechanics Report — IAAF World Championships London 2017,
#   Men's 100 m Final and Semi-Finals. 伦敦世锦赛官方生物力学报告。
#
#   这类报告的价值在于：受试者是**当场比赛成绩最好的 8 个人**，
#   测量手段是高速摄影（非激光、非加速度计），
#   且报告了逐运动员的原始关节角度 —— 与本项目的测量方式最接近。
#
# ⚠️ 逐条提取的核算过程见 scripts/literature/verify_iaaf_standards.py。
#    原始值不是手抄的，是从报告 PDF 提取后按表定位的。
#
# ⚠️ 重要局限（每条条目都会重复说明）：
#    样本量极小（7–8 人），这不是"精英群体常见范围"，
#    只能当作数量级参考。用的时候必须让教练看到这一点。

version: "2026Q1"

entries: []

verified:

