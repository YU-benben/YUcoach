# 第三方代码不参与本项目的静态分析
#
# ## 为什么
#
# `third_party/onnxruntime/` 是 vendored 的第三方包（原因见该目录的
# README / android/build.gradle）。它有自己的代码风格，与本项目的
# `flutter_lints` 规则不一致——跑 `flutter analyze` 会报出它的
# lint 提示，让门禁 G1 失败。
#
# ## 为什么不直接改它的代码
#
# 那会把"我们改了第三方代码"这件事扩散到没有必要的范围。
# 现在我们对它只有**一处**实质改动（android/build.gradle 里的
# compileSdk），清晰可查；如果连 lint 都去改，将来升级或换包时
# 就分不清哪些是必要的、哪些是顺手改的。
#
# ## 代价
#
# 我们对这份代码的**质量问题不再有工具保障**。可以接受，因为：
#   · 它已经两年没更新，本来也不指望上游修 bug
#   · 我们只用它很薄的一层（加载模型 + 跑推理）
#   · 真正的正确性由跨语言对拍测试保障（见 mobile/test/pose_parity_test.dart）
analyzer:
  exclude:
    - third_party/**
