name: onnxruntime
description: >-
  本地副本：Flutter 的 ONNX Runtime 绑定。
  原包 https://pub.dev/packages/onnxruntime 1.4.1，最后发布于两年前。
  放进项目的原因见 android/build.gradle 顶部的说明（compileSdk 校验失败）。
version: 1.4.1
homepage: https://github.com/gtbluesky/onnxruntime_flutter

environment:
  sdk: '>=2.17.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.0.1

# ⚠️ 去掉了原包的 dev_dependencies（ffigen / flutter_lints）。
#
# 原因：`ffigen` 是生成 FFI 绑定时用的，而绑定代码
# （lib/src/bindings/onnxruntime_bindings_generated.dart）已经生成好并
# 包含在本副本里 —— 我们不会再重新生成。
#
# 留着它会让 pub 去解析一个我们根本不用的重依赖，还可能和根项目的
# flutter_lints 版本冲突。
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      # ⚠️ 只保留 android。
      #
      # 原包还声明了 ios / macos / windows / linux，但那几个平台的
      # 原生库（.dylib / .dll / .so）**本副本里没有**。
      # 声明了却没有库，在那些平台上构建会失败。
      # 而本项目只在 Android 上跑手机端推理。
      android:
        ffiPlugin: true

topics:
  - onnx
  - tflite
  - pytorch
  - ai
