org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 关闭 Kotlin 增量编译。
#
# 原因：本项目的 Gradle 构建目录被 Flutter 模板指到了仓库内的
# D:\YUcoach\mobile\build，而依赖包源码在 C 盘的 pub 缓存里。
# Kotlin 增量编译缓存要求源文件与输出目录在同一根下，跨盘时报：
#
#     Could not close incremental caches ...
#     this and base files have different roots: C:\... vs D:\...
#
# 这只影响构建速度，不影响产物。
kotlin.incremental=false

# ---- 让 Flutter 插件不要覆盖我们设置的 abiFilters ----
#
# ## 问题
#
# 我们在 `android/app/build.gradle.kts` 里设了：
#
#     defaultConfig { ndk { abiFilters += listOf("arm64-v8a") } }
#
# 但**不生效** —— Flutter 的 Gradle 插件会主动清掉它：
#
#     extension.defaultConfig.ndk {
#         abiFilters.clear()
#         abiFilters.addAll(PLATFORM_ABI_LIST)   // 三种架构全加回来
#     }
#
# （见 flutter_tools 的 FlutterPlugin.kt，configureAbiWithoutSplits）
#
# 这个 `clear()` 有个实际后果，比"包变大"严重得多：
#
#     打完的 APK 里 lib/armeabi-v7a/ 和 lib/x86_64/ 下有 libflutter.so
#     和 libapp.so，**但没有 libonnxruntime.so**（那个包只带 arm64）
#         ↓
#     32 位或 x86 的设备**能装上**这个 App
#         ↓
#     一用推理就崩（UnsatisfiedLinkError）
#
# 也就是说：用户装得上、打得开，但核心功能一按就闪退。
# **"装不上"比这个好得多** —— 用户至少知道是自己手机不支持。
#
# ## 这一行做什么
#
# Flutter 提供了一个正式开关 `disable-abi-filtering`。
# 设为 true 之后，上面那段 clear/addAll 会被跳过，
# 我们在 build.gradle.kts 里设的 abiFilters 就生效了。
#
# 属性名来自 flutter_tools 的 FlutterPluginUtils.kt：
#     PROP_DISABLE_ABI_FILTERING = "disable-abi-filtering"
disable-abi-filtering=true

# ---- 允许依赖链中存在更低 compileSdk 的库 ----
#
# ## 问题
#
# `onnxruntime` 这个 Flutter 包最后一次发布是两年前，它的 Android 模块
# 是以 **android-33** 编译的。而当前的 AndroidX 依赖链
# （androidx.fragment 1.7.1、androidx.window 1.2.0 等）要求
# 依赖方编译在 **34 以上**，而 AGP 的 AAR 元数据校验是**硬失败**：
#
#     Dependency 'androidx.fragment:fragment:1.7.1' requires ...
#     compile against version 34 or later
#     :onnxruntime is currently compiled against android-33.
#
# ## 这一行做什么
#
# 它是 AGP 提供的**正式开关**，用来放行"依赖的库用了更低的 compileSdk"。
# 注意它只影响**校验**，不改变我们自己的 compileSdk（仍是 36）。
#
# ## ⚠️ 但它有代价，必须知情
#
# 官方说明：新版 AGP **可能**要求依赖库也以新版 API 编译，
# 遇到时会构建失败。也就是说这个开关**降低了对未来依赖的信心** ——
# 哪天 AndroidX 真用到了 android-34 的符号，而 onnxruntime 里
# 又静态链接了旧版本，就可能在**运行期**出问题，而构建期不会报错。
#
# ## 为什么还是接受
#
# 替代方案是把包 fork 下来自己改 compileSdk，但那就**接管了一个依赖的
# 维护** —— 对毕业设计来说代价太大。而实际风险有限：
#   · onnxruntime 的 Android 模块主要是 JNI 胶水 + 预编译的 .so
#   · 它不依赖 androidx.fragment / window 里的新 API
#
# ## 如果将来构建又失败
#
# 按代价排序的备选：
#   1. 换成仍在维护的 ONNX Flutter 包
#   2. fork 该包，把它的 compileSdk 提到 36
#   3. 写原生 Android 平台通道，直接用 ONNX Runtime 的 AAR
android.suppressUnsupportedCompileSdk=33
