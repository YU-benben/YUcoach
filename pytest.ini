[pytest]
testpaths = backend/tests
markers =
    slow: 需要真实模型或较长耗时的端到端测试

# 临时目录放到项目内。
#
# 本机系统 TEMP（C 盘）与 D:\ 根目录都不可写 —— 不指定的话，pytest 会
# 退回到当前工作目录，在项目根留下 `pytest-of-<用户>\` 文件夹。
# 见 backend/paths.py 的 apply_env_defaults() 说明。
#
# ⚠️ 必须写成 addopts = --basetemp=...。
#    `basetemp` 不是 pytest.ini 的合法选项，写在那里会被静默忽略
#    （pytest 只报一句 PytestConfigWarning，不报错），
#    表现为"明明配了却还在根目录生成 pytest-of-*"。
addopts = --basetemp=.cache/pytest-tmp
